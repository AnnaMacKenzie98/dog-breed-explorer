name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_REGION: europe-west1
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json

jobs:
  lint-and-test:
    name: Lint and dbt Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r ingestion/requirements.txt
          pip install dbt-bigquery>=1.7.0
      - run: echo '${{ secrets.GCP_SA_KEY }}' > $GOOGLE_APPLICATION_CREDENTIALS
      - run: |
          pip install ruff
          ruff check ingestion/
      - working-directory: dbt_project
        run: dbt deps
      - working-directory: dbt_project
        env:
          DBT_TARGET: dev
        run: dbt run --target dev
      - working-directory: dbt_project
        env:
          DBT_TARGET: dev
        run: dbt test --target dev

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
      - run: |
          BUILD_ID=$(gcloud builds submit ingestion/ \
            --tag gcr.io/$GCP_PROJECT/dog-pipeline:${{ github.sha }} \
            --tag gcr.io/$GCP_PROJECT/dog-pipeline:latest \
            --async --format='value(id)')
          echo "Build submitted: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe $BUILD_ID --format='value(status)')
            echo "Status: $STATUS"
            case $STATUS in
              SUCCESS) exit 0 ;;
              FAILURE|CANCELLED|TIMEOUT|EXPIRED) exit 1 ;;
            esac
            sleep 10
          done
      - run: |
          gcloud run jobs update dog-breed-ingest \
            --image gcr.io/$GCP_PROJECT/dog-pipeline:${{ github.sha }} \
            --region $GCP_REGION \
            --set-env-vars DOG_API_KEY=${{ secrets.DOG_API_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install dbt-bigquery>=1.7.0
      - working-directory: dbt_project
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > $GOOGLE_APPLICATION_CREDENTIALS
          dbt deps
          dbt run --target prod
          dbt test --target prod
          dbt docs generate --target prod

  publish-docs:
    name: Publish dbt Docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-prod
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dbt_project/target
          publish_branch: gh-pages
