version: 2

models:
  - name: dim_breed
    description: Breed dimension with size classification and temperament array
    columns:
      - name: breed_id
        description: Unique numeric identifier for the breed
        tests:
          - unique
          - not_null
      - name: breed_name
        description: Official breed name
        tests:
          - not_null
      - name: breed_group
        description: AKC breed group classification
      - name: origin
        description: Country or region of breed origin
      - name: temperament
        description: Comma-separated temperament traits as a single string
      - name: temperament_array
        description: Temperament traits split into a BigQuery ARRAY for easier analysis
      - name: avg_life_span_years
        description: Midpoint of the life span range in years
      - name: avg_weight_kg
        description: Midpoint of the weight range in kilograms
      - name: avg_height_cm
        description: Midpoint of the height range in centimetres
      - name: size_class
        description: "Weight-based size classification: Small (<=10kg), Medium (<=25kg), Large (<=45kg), Giant (>45kg), Unknown (no weight data)"
        tests:
          - accepted_values:
              arguments:
                values: ['Small', 'Medium', 'Large', 'Giant', 'Unknown']

  - name: fact_weight_life_span
    description: Fact table with numeric breed metrics — life span, weight, and height ranges
    columns:
      - name: breed_id
        description: Foreign key to dim_breed
        tests:
          - unique
          - not_null
      - name: breed_name
        description: Breed name (denormalised for query convenience)
      - name: breed_group
        description: AKC breed group classification
      - name: avg_life_span_years
        description: Midpoint of life span range in years
        tests:
          - not_null:
              config:
                where: "life_span_min is not null"
      - name: avg_weight_kg
        description: Midpoint of weight range in kilograms
      - name: life_span_range_years
        description: Spread between max and min life span (max - min)
      - name: weight_range_kg
        description: Spread between max and min weight (max - min)
      - name: has_complete_metrics
        description: True when all three metrics (life span, weight, height) have both min and max values
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
